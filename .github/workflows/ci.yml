name: ci

on:
  pull_request:
    # ready_for_review is NOT in the default set (opened, synchronize, reopened). Without
    # it a draft skips every job, ci-complete goes green on "skipped", and marking the PR
    # ready never re-runs anything — leaving a merge-eligible green that tested nothing.
    #
    # `labeled`/`unlabeled` for the same class of reason. `security-review` gates on the
    # `security-reviewed` label, and the default set does not include labelling — so adding the
    # label left the failed run untouched and the only way forward was an empty commit. A gate
    # whose satisfying action does not re-run it is a gate nobody satisfies. Caught on the very
    # PR that introduced it.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  push:
    branches: [main]

# Pushing three times to a PR should run CI once, not three times. Single biggest saver.
#
# DRAFT STATE IS PART OF THE KEY, and that is not a refinement. A push to a draft and the
# `ready_for_review` that follows it arrive in the same second and land in the same group, so
# whichever registers second cancels the first. When the draft-time push wins, it cancels the
# very run `ready_for_review` exists to produce — and that run skips the matrix. Observed on
# PR #130: two runs at 12:30:36, one cancelled, and the survivor tested nothing.
# Separate lanes, so each still collapses its own repeats.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.draft }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The matrix is GENERATED from scripts/commands.json. The day a stub flips to
  # implemented it joins the blocking set with no workflow edit — which is the answer to
  # "who remembers to add the job later?" Nobody has to.
  prepare:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    outputs:
      commands: ${{ steps.matrix.outputs.commands }}
    steps:
      - uses: actions/checkout@v7
      - id: matrix
        shell: bash
        run: |
          node -e '
            const m = require("./scripts/commands.json");
            const ids = Object.entries(m)
              .filter(([k, e]) => !k.startsWith("$") && e.status === "implemented" && e.ci === "pr")
              .map(([k]) => k);
            if (ids.length === 0) { console.error("no ci:pr commands — refusing to run an empty matrix"); process.exit(1); }
            console.log("commands=" + JSON.stringify(ids));
          ' >> "$GITHUB_OUTPUT"
      - run: echo "matrix -> ${{ steps.matrix.outputs.commands }}"

  command:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        command: ${{ fromJson(needs.prepare.outputs.commands) }}
    name: ${{ matrix.command }}
    steps:
      # TAGS, because `build` is in this matrix and the changelog page reads release dates from
      # them. The docs plugin throws on a tagless clone rather than shipping a dateless page,
      # so a shallow checkout here fails the build with that message instead of losing them
      # quietly — which is the whole reason it throws.
      - uses: actions/checkout@v7
        with:
          fetch-tags: true
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm ${{ matrix.command }}

  # B6 lists ten blocking jobs; four are not Commands-table entries, so a matrix generated
  # from the manifest alone would drop them permanently. They are written out here, and
  # repo:check asserts the union covers B6.
  changeset:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - shell: bash
        run: |
          # No published packages yet, so a changeset cannot be required. Enforced from the
          # first release; until then this states the rule rather than pretending to check.
          if [ ! -d .changeset ]; then
            echo "::notice title=changeset::.changeset does not exist yet (PR 3). Not enforced."
            exit 0
          fi
          # NO `--depth=1`. A depth-1 fetch gives the base branch's tip with no parents,
          # so `origin/base...HEAD` has nothing to walk back to and git answers
          # `fatal: no merge base`. That is invisible while the branch already contains
          # the base tip, and every open PR starts failing the moment anything else
          # merges first — with an error that has nothing to do with its own diff.
          # The checkout above is already `fetch-depth: 0`, so this bought nothing.
          git fetch origin "${{ github.base_ref }}"
          # Logic lives in scripts/changeset-required.ts, with unit tests. Inline, this asked
          # for a changeset on ANY apps/ or packages/ path — including private packages that
          # can never be published, where the demanded file cannot meaningfully be written.
          node scripts/changeset-required.ts "origin/${{ github.base_ref }}"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      # The gitleaks ACTION requires GITLEAKS_LICENSE for organisation repos; the CLI does
      # not. Same scanner, same rules, no licence server in the critical path of every PR.
      - shell: bash
        run: |
          # Pinned and checksummed. Piping an unverified download straight into a shell is
          # a poor look in the job whose entire purpose is supply-chain hygiene.
          VERSION=8.30.1
          # From the release's own checksums.txt, fetched 2026-08-07.
          SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          # `--fail` and `--retry`, because without them a bad response BECOMES a checksum
          # mismatch. `curl -sSLo` writes an error page or a truncated body to the file on any
          # HTTP status, the hash then differs, and this job reported "checksum mismatch —
          # refusing to run it" on a release nobody had touched. In the job whose entire purpose
          # is supply-chain hygiene, "the download failed" must not be indistinguishable from
          # "the artifact was tampered with", and it must not be the scarier of the two that
          # gets asserted.
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            || { echo "::error::could not download gitleaks ${VERSION} — a network or release problem, not a security one"; exit 1; }
          echo "${SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c - \
            || { echo "::error::gitleaks ${VERSION} downloaded but its checksum does not match the pin. The download succeeded, so this is the artifact having changed. Verify against the release's checksums.txt before touching the pin."; exit 1; }
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --no-banner --exit-code 1

  # Not "no infrastructure in the diff" as a habit — as a check. The repo is going public
  # and a CI grep cannot see anything already at HEAD, so this only holds the line forward.
  no-infra-leak:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      # The scanner is a .ts file run through Node's native type stripping, so it needs the
      # pinned Node 24 — the runner's default is older and would fail to parse it. Pinning
      # via .nvmrc rather than a literal keeps it with the rest of the toolchain.
      - uses: actions/setup-node@v7
        # `package-manager-cache: false` is REQUIRED here, not tidiness. v5 turned that flag on
        # by default; it reads `packageManager` from package.json and shells out to pnpm to
        # locate the store. This job never installs pnpm — it only needs Node to run a .ts
        # scanner — so the default made it fail with "Unable to locate executable file: pnpm".
        # The composite action does not need it: it runs pnpm/action-setup first.
        with: { node-version-file: '.nvmrc', package-manager-cache: false }
      - shell: bash
        env:
          # Our actual coordinates, never stored in the repo. Absent on fork PRs, which
          # receive no secrets — the script warns rather than failing, because blocking every
          # community contribution to prevent a leak a contributor cannot cause is the wrong
          # trade. See scripts/infra-leak-patterns.json for the two-class design.
          EXTRA_INFRA_PATTERNS: ${{ secrets.EXTRA_INFRA_PATTERNS }}
        run: |
          # NO `--depth=1`. A depth-1 fetch gives the base branch's tip with no parents,
          # so `origin/base...HEAD` has nothing to walk back to and git answers
          # `fatal: no merge base`. That is invisible while the branch already contains
          # the base tip, and every open PR starts failing the moment anything else
          # merges first — with an error that has nothing to do with its own diff.
          # The checkout above is already `fetch-depth: 0`, so this bought nothing.
          git fetch origin "${{ github.base_ref }}"
          git diff "origin/${{ github.base_ref }}"...HEAD > /tmp/pr.diff
          # Logic lives in scripts/infra-leak.ts, not inline here, so it has unit tests. An
          # inline check is one nobody can run locally, and therefore one nobody has verified.
          node scripts/infra-leak.ts /tmp/pr.diff

  build-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - shell: bash
        run: |
          # amd64 only. arm64 builds in the release workflow on a native runner — buildx
          # under QEMU is 5-10x slower and breaks the ten-minute rule.
          # The Dockerfile is at the REPO ROOT. This tested `docker/Dockerfile`, which has
          # never existed — so the condition was always false, the job always took the notice
          # branch, and one of B6's ten "blocking" jobs has never built the image on any PR.
          # A broken Dockerfile would have passed CI silently.
          #
          # No `if` any more. If the file is missing the build fails, which is the correct
          # answer for a job named build-docker.
          docker build --platform linux/amd64 -f Dockerfile -t proxlane:ci .

      # AND THEN RUN IT. Building an image proves it compiles, not that it starts.
      #
      # `pnpm dev` was broken for the gateway indefinitely and no check noticed, because
      # nothing in CI boots the gateway: the e2e suite builds `createApp` directly and never
      # touches `src/index.ts`, so the boot path — env parsing, the memory check, provider
      # ordering, the refusal to run without a key — was covered by nothing that runs on a PR.
      # `selfhost:smoke` does cover it and is `ci: none` because it is slow; this is the cheap
      # half, and the image is already built by the step above so it costs seconds.
      #
      # The job keeps its name. It is referenced by `main`'s ruleset as a required check, and
      # renaming it would leave every PR waiting on a check that no longer reports.
      - name: boot the image it just built
        shell: bash
        run: |
          set -euo pipefail

          # 1. It must REFUSE to start with no gateway key. This is the one failure that is
          #    unrecoverable in production — an open proxy funded by whoever deployed it — so
          #    a regression here is worse than a crash.
          if docker run --rm --name proxlane-open proxlane:ci >/dev/null 2>&1; then
            echo "::error::the gateway started without PROXLANE_API_KEY, which makes it an open proxy"
            exit 1
          fi
          echo "  refuses to start without a key"

          # 2. With a key it must serve. No provider keys on purpose: a gateway with none is
          #    correctly running and answers NO_PROVIDER_AVAILABLE, which is what a stranger
          #    evaluating this with `docker run` actually sees first.
          docker run -d --name proxlane-smoke -p 8787:8787 \
            -e PROXLANE_API_KEY=ci-smoke-key proxlane:ci

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/health >/dev/null 2>&1; then break; fi
            if [ "$i" = "30" ]; then
              echo "::error::the gateway never answered /health within 30s"
              docker logs proxlane-smoke || true
              exit 1
            fi
            sleep 1
          done

          HEALTH=$(curl -fsS http://127.0.0.1:8787/health)
          echo "  /health -> $HEALTH"
          case "$HEALTH" in
            *'"status":"ok"'*) ;;
            *) echo "::error::unexpected /health body: $HEALTH"; exit 1 ;;
          esac
          # The version, and a REAL one. `deploy-gateway.yml` polls this field to decide whether
          # the build it just published is actually serving, so a missing or `unknown` version
          # silently turns that check into a no-op — which is the exact failure the field was
          # added to prevent.
          case "$HEALTH" in
            *'"version":"unknown"'*)
              echo "::error::/health reports version unknown — package.json is not reachable in the image"
              exit 1 ;;
            *'"version":"'[0-9]*) ;;
            *) echo "::error::/health carries no version: $HEALTH"; exit 1 ;;
          esac

          # 3. The scrape surface answers, and answers with the taxonomy rather than a stack
          #    trace. No providers configured, so NO_PROVIDER_AVAILABLE is the correct answer.
          OUT=$(curl -sS -o /dev/null -w '%{http_code} %header{x-outcome} %header{x-outcome-class}' \
            "http://127.0.0.1:8787/v1?api_key=ci-smoke-key&url=https://example.com")
          echo "  /v1 -> $OUT"
          case "$OUT" in
            "503 NO_PROVIDER_AVAILABLE gateway") ;;
            *) echo "::error::unexpected /v1 response: $OUT"; docker logs proxlane-smoke; exit 1 ;;
          esac

          # 4. A wrong key is refused. Cheap, and it is the other half of "not an open proxy".
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
            "http://127.0.0.1:8787/v1?api_key=wrong&url=https://example.com")
          [ "$CODE" = "401" ] || { echo "::error::a wrong key got $CODE, not 401"; exit 1; }
          echo "  a wrong key is refused"

          # 5. The boot banner is the operator's first diagnostic. If it stops naming what it
          #    configured, support questions start with a blank page.
          # Version-bearing, deliberately: the banner is where an operator reads what they are
          # running before they think to curl anything. A literal "proxlane gateway on" match
          # broke the moment the version was added, so this asserts the shape that replaced it
          # rather than going loose enough to pass either way.
          #
          # CAPTURED FIRST, NOT PIPED INTO `grep -q`. `-q` exits on the first match, which
          # SIGPIPEs `docker logs`; `shell: bash` is `-o pipefail`, so the pipeline reports 141
          # and the step fails BECAUSE the banner was found. The error it prints is the exact
          # opposite of what happened, directly above a dump of the banner it says is missing.
          #
          # NOT a volume race, which is the plausible-sounding wrong answer: the log here is
          # ~1.3 KB, far inside the 64 KB pipe buffer, and it still happens. `docker logs` is a
          # client streaming from the daemon, not one write to a pipe, so it is still mid-call
          # when grep leaves. Measured over 25 boots of this exact image and sequence: the old
          # line failed 12 times, this one zero. It is rarer on the CI runner than locally,
          # which is why it read as "that job is occasionally flaky" for as long as it did.
          LOGS=$(docker logs proxlane-smoke 2>&1)
          if ! printf '%s' "$LOGS" | grep -E "proxlane gateway [0-9]+\.[0-9]+\.[0-9]+ on" >/dev/null; then
            echo "::error::the boot banner is missing or does not name a version"
            printf '%s\n' "$LOGS"
            exit 1
          fi
          echo "  boot banner present, with a version"

      - name: gateway logs
        if: always()
        run: docker logs proxlane-smoke 2>&1 | tail -40 || true

      - name: stop
        if: always()
        run: docker rm -f proxlane-smoke proxlane-open >/dev/null 2>&1 || true

  security-review:
    runs-on: ubuntu-latest
    # Scoped to this job rather than the workflow: only this one reads PR metadata, and the
    # workflow-level grant is `contents: read`. Read-only — the job checks for a label, it
    # never sets one, because a gate that can satisfy itself is not a gate.
    permissions:
      contents: read
      pull-requests: read
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - shell: bash
        env:
          # The labels on this PR, so the gate below can read an explicit acknowledgement.
          # From the API, not the event payload. The payload is frozen at trigger time, so
          # re-running a failed job by hand would re-read the labels as they were when it first
          # ran — which is exactly the state the person re-running is trying to change.
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Conditional by design. security-engineer has no write tools and cannot own the
          # code it reviews, so the trigger set lives in a file both this job and
          # repo:check read — they cannot disagree about what counts as security-touching.
          # NO `--depth=1`. A depth-1 fetch gives the base branch's tip with no parents,
          # so `origin/base...HEAD` has nothing to walk back to and git answers
          # `fatal: no merge base`. That is invisible while the branch already contains
          # the base tip, and every open PR starts failing the moment anything else
          # merges first — with an error that has nothing to do with its own diff.
          # The checkout above is already `fetch-depth: 0`, so this bought nothing.
          git fetch origin "${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)
          MATCH=$(node -e '
            const cfg = require("./scripts/security-review-paths.json");
            const changed = process.argv[1].split("\n").filter(Boolean);
            const hit = changed.filter((f) => cfg.paths.some((p) => {
              // A prefix match on a non-glob entry is too loose: "SECURITY.md" would also
              // match "SECURITY.md.bak". Globs match their directory; everything else is
              // an exact path.
              if (!p.endsWith("/**")) return f === p;
              return f.startsWith(p.slice(0, -2));
            }));
            console.log(hit.join("\n"));
          ' "$CHANGED")
          if [ -z "$MATCH" ]; then
            echo "not security-touching"
            exit 0
          fi
          echo "security-touching files in this diff:"
          echo "$MATCH"
          # A NOTICE INSIDE A GREEN CHECK ROUTES NOWHERE. `operating.md` B6 lists this among ten
          # "all blocking" jobs and `repo:check` reports it as covered, but the job was an echo:
          # a PR rewriting `packages/shared/src/edge-guard.ts` printed a `::notice::` and merged
          # with nothing seen by anybody. CODEOWNERS cannot compensate — CLAUDE.md deliberately
          # gives security-engineer only `SECURITY.md`, because it has no write tools and cannot
          # own code it cannot edit — so this job IS the routing.
          #
          # The gate is an explicit acknowledgement rather than an approval from an account that
          # does not exist: label the PR `security-reviewed` once the pass has been done. That is
          # a deliberate act by a human, which is the whole point, and it is visible on the PR
          # afterwards rather than buried in a log.
          LABELS=$(gh api "repos/${{ github.repository }}/issues/$PR/labels" --jq '.[].name')
          if echo "$LABELS" | grep -qx 'security-reviewed'; then
            echo "::notice title=security-review::acknowledged via the security-reviewed label"
            exit 0
          fi
          echo "::error title=security-review::This diff touches security-sensitive paths. Run the security-engineer pass, then add the 'security-reviewed' label to this PR."
          exit 1

  # One required check for the ruleset. Requiring B6's ten by name would leave every PR
  # permanently pending: six report under different names and four never report at all.
  # THE ONE REQUIRED CHECK on main, so what it accepts is what the ruleset enforces.
  #
  # `skipped` used to count as success for every job, which made a green here mean "nothing
  # went red" rather than "the checks ran". A draft PR skips `prepare`, `command` skips with
  # it, and this reported all upstream jobs green having tested nothing — then the PR is
  # marked ready and merged on that green. Confirmed on PR #130.
  #
  # So skipping is allowed only where a job HAS a condition that can legitimately hold:
  # `changeset`, `no-infra-leak` and `security-review` are `if: event_name == 'pull_request'`
  # and correctly skip on a push to main. `prepare` skips only on a draft, and `secrets` and
  # `build-docker` carry no condition at all — a skip there is structural, not intended.
  ci-complete:
    if: always()
    needs: [prepare, command, changeset, secrets, no-infra-leak, build-docker, security-review]
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "$NEEDS"
          node -e '
            const needs = JSON.parse(process.env.NEEDS);
            const event = process.env.EVENT;
            // Skipping is honest ONLY for these, and ONLY off a pull_request.
            const MAY_SKIP = new Set(["changeset", "no-infra-leak", "security-review"]);
            const bad = [];
            for (const [name, v] of Object.entries(needs)) {
              if (v.result === "success") continue;
              if (v.result === "skipped" && MAY_SKIP.has(name) && event !== "pull_request") continue;
              bad.push(`${name}=${v.result}`);
            }
            if (bad.length) {
              console.error("not green: " + bad.join(", "));
              if (bad.some((b) => b.startsWith("prepare=skipped"))) {
                console.error("prepare skipped — this PR is a draft, so nothing was tested.");
                console.error("Mark it ready for review; that re-runs the matrix.");
              }
              process.exit(1);
            }
            console.log("every upstream job ran and passed");
          '
