name: release

# Publishing. `operating.md` B8: changesets accumulate on `main`, a release PR is opened
# automatically, and merging it publishes npm packages, a git tag, a GitHub Release, and
# multi-arch images to ghcr.
#
# THIS FILE DID NOT EXIST until now, which nothing noticed. `CLAUDE.md`'s ownership table has
# carried a row for it since the scaffold, B8 described its behaviour in the present tense,
# and 22 changesets accumulated behind a publish path that was never written. `repo:check`
# assertion 22 now fails if a workflow the ownership table claims is missing — an owner for a
# file nobody wrote is the same shape as a green check that tested nothing.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: rehearse without publishing or tagging
        type: boolean
        default: true

# Two releases racing would publish two versions of the same package. Never cancel a running
# one — a half-finished publish is worse than a queued one.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # tags, the release commit, and the GitHub Release
  pull-requests: write # the release PR
  packages: write # ghcr
  id-token: write # npm provenance: the attestation is signed with this, not with a secret

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # `secrets` cannot be read in a step `if:`, so the presence test is hoisted to `env`,
      # which can. This is what makes the App optional rather than required.
      HAS_APP: ${{ (secrets.RELEASE_APP_CLIENT_ID != '' || secrets.RELEASE_APP_ID != '') && secrets.RELEASE_APP_PRIVATE_KEY != '' }}
      # Which identifier is available. These are DIFFERENT VALUES, not two names for one:
      # `client-id` wants the App's Client ID string, `app-id` wants its numeric App ID.
      HAS_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID != '' }}
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      # The GATEWAY's version, and whether this commit changed it. Both exist because the
      # gateway is `private: true`: it is versioned and gets a CHANGELOG, but `changeset
      # publish` never publishes it, so `published` is false for a gateway-only release.
      gatewayVersion: ${{ steps.gateway.outputs.version }}
      gatewayChanged: ${{ steps.gateway.outputs.changed }}
    steps:
      # A PR OPENED WITH `GITHUB_TOKEN` TRIGGERS NO WORKFLOWS. That is GitHub's anti-recursion
      # rule, and it meant the release PR arrived with zero checks while `main`'s ruleset
      # requires `ci-complete` with no bypass actor — so every release had to be closed and
      # reopened by hand to make CI run. A GitHub App installation token is a different
      # identity and does trigger them.
      #
      # An App rather than a PAT deliberately: this mints a token that lives one hour, and the
      # only thing at rest is the App's private key. A PAT with `contents:write` on `main`
      # would be a standing credential, which is the posture this project removed when it
      # dropped the npm token for OIDC.
      #
      # OPTIONAL BY DESIGN. With the secrets absent every step below falls back to
      # `GITHUB_TOKEN`, and the release still works exactly as it did — it just needs the
      # manual close/reopen again. Nothing breaks if the App is removed or its key rotated out.
      # TWO STEPS, ONE OF WHICH RUNS, because the action's two identifier inputs take
      # different values rather than being two spellings of one.
      #
      #   client-id   "GitHub App Client ID"   the Iv23… string
      #   app-id      "GitHub App ID"          the numeric id, and now carries
      #                                        deprecationMessage: "Use 'client-id' instead."
      #
      # So the fix for the deprecation warning is NOT renaming the key. Passing the numeric id
      # to `client-id` would be handing the action a value it does not describe, in the one
      # workflow whose failure mode is an unpublishable release.
      #
      # Add a `RELEASE_APP_CLIENT_ID` secret, from the App's settings page, and the first step
      # takes over and the warning stops. Until then the second keeps working exactly as it
      # did. Neither input is required by the action, so this is a supported configuration
      # rather than a trick.
      - name: mint a release token
        id: app_client
        if: env.HAS_APP == 'true' && env.HAS_CLIENT_ID == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: mint a release token (legacy app id)
        id: app_legacy
        if: env.HAS_APP == 'true' && env.HAS_CLIENT_ID != 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          # Changesets needs the history to work out what changed since the last tag.
          fetch-depth: 0
          # Checked out with the App token so the branch push carries that identity too. Push
          # and PR must agree: a branch pushed as `github-actions[bot]` still suppresses the
          # workflow run even when the PR itself is opened by the App.
          token: ${{ steps.app_client.outputs.token || steps.app_legacy.outputs.token || secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/setup

      # The rehearsal, run before anything is published rather than after. `release:dry`
      # packs with pnpm and inspects the resulting tarball, which is the only thing that
      # catches `workspace:*` surviving into a published manifest — the defect that shipped
      # proxlane@0.0.0 uninstallable, because `npm publish --dry-run` succeeds on it.
      - run: pnpm release:dry

      # THERE IS NO NPM CREDENTIAL. Publishing authenticates with OIDC trusted publishing, so
      # nothing here holds a token and there is no expiry to preflight.
      #
      # A credential check used to live at this point, because an npm automation token is
      # capped at 90 days and an expired one failed AFTER the release PR merged — leaving
      # `main` claiming a version the registry did not have. That failure mode is now gone
      # rather than guarded: there is no token to expire.
      #
      # What replaced the preflight is a POST-publish check, further down. The reason it moved
      # to the far side is npm's fallback behaviour: with a token configured, npm silently uses
      # it when the OIDC exchange fails, so a green release proved nothing about which
      # credential was used. Deleting the token removes the fallback, and the check confirms
      # the registry recorded a trusted publish rather than assuming it.
      #
      # The remaining way to break this is renaming `release.yml`, because the trust config on
      # npmjs.com is bound to the filename. `repo:check` assertion 22 keeps that path existing,
      # since `CLAUDE.md`'s ownership table names it literally.

      # NEVER MERGE AN EMPTY CHANGESET TO `main`. It stalls this job in both directions:
      # the action sees a changeset, so it takes the `version` branch rather than `publish`,
      # then logs "All changesets are empty; not creating PR" and exits 0. Green run, no
      # release PR, nothing published, and no error anywhere to explain it.
      #
      # This cost a release cycle. `pnpm changeset add --empty` is the documented way to
      # satisfy the changeset CI gate for a change that needs no bump, and on a branch that
      # is exactly what it does — but once merged it is a silent handbrake, and the next
      # release is the thing that notices.
      #
      # If a PR touches a versioned package but must not bump it, land it in the same PR as
      # something that does bump, or accept the bump. Do not park an empty changeset on main.
      # PINNED TO v1, DELIBERATELY. Do not bump this with the other actions.
      #
      # changesets/action v2 requires Changesets CLI v3 and refuses to run against v2:
      # "This version of the Changesets action is designed to work with Changesets CLI v3."
      # It also renames every input — `version`, `publish`, `commit`, `title` and
      # `createGithubReleases` are all rejected as unexpected.
      #
      # `@changesets/cli` is pinned at ^2.31 in CLAUDE.md's toolchain table, so the action
      # cannot move until the CLI does, and that is a release-path migration of its own rather
      # than a version bump. v1 still targets node24, so it is not part of the deprecation
      # this repo just cleared.
      - name: publish
        id: changesets
        if: inputs.dry_run != true
        uses: changesets/action@v1
        with:
          # `version` writes the bumps and changelogs; `publish` runs when there is nothing
          # left to version, i.e. on the merge of the release PR. One job, both halves.
          version: pnpm exec changeset version
          publish: pnpm exec changeset publish
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
          createGithubReleases: true
        env:
          # The App token when it exists, `GITHUB_TOKEN` when it does not. This is the line
          # that decides whether the release PR arrives with CI already running or needs a
          # human to close and reopen it.
          GITHUB_TOKEN: ${{ steps.app_client.outputs.token || steps.app_legacy.outputs.token || secrets.GITHUB_TOKEN }}
          # No NODE_AUTH_TOKEN. `changeset publish` spawns `pnpm publish`, which rewrites
          # `workspace:*` and hands off to the npm CLI — and the npm CLI performs the OIDC
          # exchange itself using `id-token: write` above. Both halves are required: publishing
          # through npm alone leaves `workspace:*` in the manifest and the tarball is
          # uninstallable, which is how proxlane@0.0.0 shipped.
          #
          # This is also why the pnpm pin is load-bearing beyond the catalog. pnpm 11.0.x
          # reimplemented publish natively, dropped the npm delegation and broke OIDC
          # publishing outright; it was repaired in 11.0.7. See CLAUDE.md's toolchain row.
          # Provenance: a verifiable link from the tarball to this commit and this workflow.
          # It needs `id-token: write` above and a public repo, both of which hold. For a
          # product that handles other people's provider keys this is the supply-chain
          # control that matters most.
          NPM_CONFIG_PROVENANCE: true

      # OIDC TRUSTED PUBLISHING IS THE DESTINATION, AND IS NOT WIRED YET.
      #
      # `plan.md` decided it: it removes the long-lived npm token rather than storing one.
      # Two things stop it being switched on in this PR, and both are facts rather than
      # preferences. Publishing MUST go through pnpm — `npm publish` leaves `workspace:*`
      # verbatim in the manifest and the tarball is then uninstallable, which is exactly how
      # proxlane@0.0.0 shipped broken — and pnpm's support for the registry's OIDC exchange
      # is not something this repo has verified. Claiming it works would be a guess in the
      # one place a guess is unrecoverable.
      #
      # So: token auth today, provenance on regardless, and the swap is a one-line env change
      # plus deleting the secret, once a real publish has proven the exchange.
      # Did that publish actually use OIDC, or did it quietly fall back to the token?
      #
      # npm prefers trusted publishing and falls back to `_authToken` when the exchange fails,
      # so the publish succeeds either way and the credential posture can regress in silence.
      # The registry records which was used; this reads it back. Without this step, "the
      # release was green" says nothing about how it authenticated, and the whole point of
      # trusted publishing is the credential.
      #
      # Runs AFTER the publish deliberately: the packages are already out, so a failure here
      # is a posture regression to investigate, not a broken release to unwind.
      - name: verify the publish used trusted publishing
        if: steps.changesets.outputs.published == 'true'
        run: node scripts/verify-trusted-publish.ts '${{ steps.changesets.outputs.publishedPackages }}'

      # THE GATEWAY'S OWN VERSION, not the CLI's.
      #
      # This read `packages/cli/package.json` and tagged the gateway image with it, so
      # `ghcr.io/proxlane/gateway:0.1.1` was the CLI's 0.1.1 while the gateway was on 0.3.1.
      # Two independently versioned things sharing one number, and the number belonged to the
      # other one.
      - name: read the gateway version, and whether it moved
        id: gateway
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./apps/gateway/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # A gateway-only release publishes nothing to npm, so `published` is false and the
          # image job used to be skipped. The artifact a gateway release produces IS the
          # image, so the signal has to be its version changing, not npm.
          PREVIOUS=$(git show HEAD~1:apps/gateway/package.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" 2>/dev/null || echo "none")
          if [ "$VERSION" != "$PREVIOUS" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "  gateway $PREVIOUS -> $VERSION, the image will be built"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "  gateway unchanged at $VERSION, no image to build"
          fi

  # Images follow the npm publish rather than racing it, so a tag that exists on ghcr always
  # has a matching package on npm.
  #
  # NATIVE RUNNERS, ONE PER ARCHITECTURE, not one job emulating arm64 under QEMU.
  #
  # This was `platforms: linux/amd64,linux/arm64` on a single amd64 runner. The comment
  # predicted it would be "5-10x slower"; measured on the 0.3.0 release it ran over an hour
  # without finishing and had to be cancelled, leaving npm published and ghcr two minor
  # versions behind. A release that publishes half of itself is worse than one that fails.
  #
  # `ubuntu-24.04-arm` has been generally available and free on public repositories since
  # August 2025. `plan.md` anticipated exactly this and said to verify before relying on it:
  # this repo is public, so it qualifies. If that ever changes the job fails loudly with no
  # runner matching the label, which is the right failure.
  #
  # Each arch pushes BY DIGEST and the manifest is assembled afterwards. That is the
  # documented pattern for multi-runner builds: neither job may push a tag, because the
  # second to finish would overwrite the first and the image would silently become
  # single-architecture.
  images:
    needs: release
    # EITHER signal. npm publishing and image publishing are different events: a release that
    # only touches the gateway publishes no package but must still ship an image, and a
    # release that only touches the SDK publishes a package and needs no new image. Gated on
    # `published` alone, every gateway-only release since 0.1.1 silently skipped this job,
    # which is why ghcr sat two minor versions behind for weeks.
    if: needs.release.outputs.published == 'true' || needs.release.outputs.gatewayChanged == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            slug: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # Scoped per architecture. One shared scope has the two jobs evicting each other's
          # layers, which costs more than the cache saves.
          cache-from: type=gha,scope=${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.slug }}
          outputs: type=image,name=ghcr.io/proxlane/gateway,push-by-digest=true,name-canonical=true,push=true
      - name: keep the digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          # STRIP THE `sha256:` PREFIX. upload-artifact rejects a colon in a filename, so
          # naming the file after the raw digest failed the job after a successful build:
          # "The path for one of the files in artifact is not valid ... Contains the following
          # character: Colon". The manifest step already expected the bare hex.
          DIGEST='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.slug }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  # The manifest list. Until this runs, the digests above are unreferenced by any tag.
  manifest:
    needs: [release, images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: assemble and push the tags
        run: |
          set -euo pipefail
          cd /tmp/digests
          # `:latest` exists and B8 documents it as the unstable choice; the compose file
          # pins a version.
          docker buildx imagetools create \
            -t ghcr.io/proxlane/gateway:${{ needs.release.outputs.gatewayVersion }} \
            -t ghcr.io/proxlane/gateway:latest \
            $(printf 'ghcr.io/proxlane/gateway@sha256:%s ' *)
      - name: prove both architectures are in the manifest
        run: |
          set -euo pipefail
          # Without this a dropped digest ships a single-arch image under a multi-arch tag,
          # and the first Pi to pull it is the one that finds out.
          ARCHES=$(docker buildx imagetools inspect \
            ghcr.io/proxlane/gateway:${{ needs.release.outputs.gatewayVersion }} --raw \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const m=JSON.parse(s);console.log((m.manifests||[]).map(x=>x.platform&&x.platform.architecture).filter(a=>a&&a!=="unknown").sort().join(","))})')
          echo "  manifest architectures: $ARCHES"
          [ "$ARCHES" = "amd64,arm64" ] || { echo "::error::expected amd64,arm64 — got $ARCHES"; exit 1; }
