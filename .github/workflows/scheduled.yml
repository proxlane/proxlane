name: scheduled

# Three crons in one file rather than three files. All are stubs today and say so by
# failing honestly — the commands they run exit 1 naming their owner and blocking file.
on:
  schedule:
    - cron: '17 6 * * 1'   # canary:live   — weekly at launch, nightly once revenue exists
    - cron: '23 6 * * 2'   # cost-drift    — weekly
    - cron: '29 6 * * 3'   # record:diff   — weekly
    - cron: '41 6 * * 4'   # health-sim    — weekly
    - cron: '53 6 * * 5'   # selfhost:smoke — weekly
  workflow_dispatch:
    inputs:
      job:
        description: which job to run
        type: choice
        options: [canary, cost-drift, record-diff, health-sim, selfhost-smoke]

permissions:
  contents: read
  issues: write

jobs:
  canary:
    if: github.event.schedule == '17 6 * * 1' || inputs.job == 'canary'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      # test:live is a stub that exits 1. Without this the canary opens a provider-drift
      # issue every Monday from day one — and a weekly false alarm is how a real one stops
      # being read.
      - id: implemented
        shell: bash
        run: |
          node -e 'process.exit(require("./scripts/commands.json")["test:live"].status === "implemented" ? 0 : 1)' \
            && echo "yes=true" >> "$GITHUB_OUTPUT" \
            || { echo "yes=false" >> "$GITHUB_OUTPUT"; echo "::notice::test:live is still a stub; canary is dormant"; }
      # A second dormancy gate, for a different reason than the first. test:live is now
      # implemented, so the stub guard above passes — but the canary needs real provider
      # keys, and without them it fails with "no provider keys" every single Monday. That is
      # the same weekly false alarm the guard above exists to prevent, arriving by another
      # route, and a canary nobody reads is worse than no canary.
      - id: keyed
        shell: bash
        env:
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          SCRAPINGBEE_KEY: ${{ secrets.SCRAPINGBEE_KEY }}
          SCRAPFLY_KEY: ${{ secrets.SCRAPFLY_KEY }}
          BRIGHTDATA_KEY: ${{ secrets.BRIGHTDATA_KEY }}
          FIRECRAWL_KEY: ${{ secrets.FIRECRAWL_KEY }}
        run: |
          if [ -n "$SCRAPERAPI_KEY" ] || [ -n "$SCRAPINGBEE_KEY" ] || [ -n "$SCRAPFLY_KEY" ] || [ -n "$BRIGHTDATA_KEY" ] || [ -n "$FIRECRAWL_KEY" ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=canary::No provider key secrets are set, so the canary is dormant. The three-week launch gate clock has NOT started. Add SCRAPERAPI_KEY, SCRAPINGBEE_KEY, SCRAPFLY_KEY, BRIGHTDATA_KEY or FIRECRAWL_KEY."
          fi
      - id: run
        if: steps.implemented.outputs.yes == 'true' && steps.keyed.outputs.yes == 'true'
        continue-on-error: true
        env:
          # Trial-account keys, per operations.md. Absent on a fork PR by design — GitHub
          # does not expose secrets there, which is what makes it structurally impossible to
          # burn credits on a community contribution.
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          SCRAPINGBEE_KEY: ${{ secrets.SCRAPINGBEE_KEY }}
          SCRAPFLY_KEY: ${{ secrets.SCRAPFLY_KEY }}
          # The fourth adapter. Without it `test:live` generated zero tests for Bright Data
          # and the canary went green anyway — a blind spot the size of a whole provider.
          BRIGHTDATA_KEY: ${{ secrets.BRIGHTDATA_KEY }}
          FIRECRAWL_KEY: ${{ secrets.FIRECRAWL_KEY }}
        run: pnpm test:live
      - if: steps.keyed.outputs.yes == 'true' && steps.run.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # NO `|| echo` HERE. An alert that cannot be delivered is the same as no alert,
          # and this one could not be for eleven weeks: `flag:provider-drift` had never been
          # created, `gh` resolves label names server-side and errors when one is missing, and
          # the `|| echo` turned that into a warning on a run `continue-on-error` had already
          # made green. Assertion 40 now holds every `--label` to `.github/labels.json`; this
          # is the second guard, for what an offline check cannot see.
          #
          # A FAILING CANARY MEANS SOMETHING IN THE LOOP CHANGED, AND THIS STEP CANNOT KNOW
          # WHICH. It used to say "a provider changed under us" and label the issue
          # `flag:provider-drift` on that basis, which is a diagnosis asserted by a step whose
          # only evidence is that an assertion failed.
          #
          # It was wrong the first time it fired for real. #232 opened as provider drift; all
          # three failures were Bright Data answering AUTH_FAILED in 62-235ms, and the cause was
          # ours — the canary hand-rolled a fetch and never sent `wire.body`, so the only adapter
          # that POSTs one got `400 "zone" is required`. No provider had changed anything. The
          # label sent the diagnosis in the wrong direction for four days.
          #
          # So the title and the label now state what was observed. `record:diff` keeps
          # `flag:provider-drift`, because that job actually compares a recorded fixture against
          # live and can show what moved; a human may apply it here once they have established
          # the cause. The machine reports; the person diagnoses.
          #
          # It opens an issue rather than turning a scheduled run red where nobody looks.
          #
          # ONE ISSUE, NOT ONE PER RUN. This was an unconditional `gh issue create`, and eight
          # canary runs in a single morning opened eight identical issues on a public repo —
          # the whole open-issue list, all dated the same day, all the same failure. To a
          # visitor that reads as a project falling over rather than as one provider being
          # misconfigured. A drift issue is about a provider that changed, and it stays true
          # until somebody closes it, so a second run finding the same thing has nothing new
          # to say: it comments on the open one and moves on.
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING="$(gh issue list --label flag:canary-red --state open \
            --json number --jq '.[0].number // empty')"
          BODY="$(printf '`pnpm test:live` failed on the scheduled canary. Run: %s\n\nThe cause is not known from here. Candidates, roughly in the order they have actually happened:\n\n- our own code, if a request stopped reaching the provider intact (#232, #237)\n- a credential that is expired, unset, or out of quota\n- the canary test target changing what it serves\n- a provider genuinely changing its response shape or outcomes\n\nRead the failing assertion and the timings before assuming the last one. A refusal in under a second usually means the request never reached a target.' "$RUN_URL")"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Still failing. Run: $RUN_URL"
          else
            gh issue create --title "canary red: test:live failed $(date -u +%F)" \
              --label "flag:canary-red" \
              --body "$BODY"
          fi
      # THE LAUNCH GATE READS THE STEP, NOT THE JOB. `continue-on-error: true` above makes the
      # job green whether the canary passed or failed — by design, so drift opens an issue
      # rather than reddening a scheduled run nobody looks at. But `state.md` counts "three
      # consecutive scheduled greens" as operations.md section 9's launch gate, and under that
      # setting a green is not evidence the canary passed. This makes the two differ.
      - if: steps.run.outcome == 'failure'
        run: |
          echo "::error title=canary::test:live failed. This run does NOT count toward the three consecutive greens in operations.md section 9."
          exit 1

  cost-drift:
    if: github.event.schedule == '23 6 * * 2' || inputs.job == 'cost-drift'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - run: echo "::notice::cost-drift needs the ledger and a cost table with reported values; neither exists"

  # Re-record every fixture and compare. This is the only thing in the repo that can notice a
  # provider changing its response shape underneath us.
  #
  # IT RAN FOR WEEKS WITHOUT COMPARING ANYTHING. The step was
  # `pnpm record --diff || echo "::notice::record is a stub; nothing to diff yet"`, and `--diff`
  # existed nowhere in `scripts/record.ts` — so it exited 2 on the missing `--adapter`, the
  # `|| echo` swallowed that, and the job went green every Wednesday. It also had no provider
  # keys, so it could not have worked even if the flag had existed. Two independent failures,
  # either one sufficient, in six lines of YAML.
  #
  # `|| echo` is gone. Drift fails the job.
  record-diff:
    if: github.event.schedule == '29 6 * * 3' || inputs.job == 'record-diff'
    runs-on: ubuntu-latest
    permissions:
      # READ, not write. This job runs `pnpm install` lifecycle scripts and `pnpm record`
      # against live provider APIs, and writes third-party response bodies to disk. It has no
      # business holding a credential that can write to the repository: the renewed fixtures
      # travel to `fixture-dates` below as an artifact, and the push happens there, in a job
      # that runs no workspace code and talks to no provider.
      contents: read
      # A JOB-LEVEL BLOCK REPLACES THE WORKFLOW-LEVEL ONE, it does not extend it. The
      # `issues: write` at the top of this file does not reach here, so the drift issue this
      # job now opens would have 403'd — silently turning the reporting step into the same
      # invisible failure it exists to end.
      issues: write
    strategy:
      fail-fast: false
      matrix:
        # The secret name is carried explicitly rather than derived from the adapter id. The
        # `secrets` context is looked up by an exact name, and `record.ts` derives its env var
        # by uppercasing — so a matrix of lowercase ids would silently find nothing and every
        # leg would report itself dormant, which reads exactly like "no keys configured".
        include:
          - adapter: scraperapi
            secret: SCRAPERAPI_KEY
          - adapter: scrapingbee
            secret: SCRAPINGBEE_KEY
          - adapter: scrapfly
            secret: SCRAPFLY_KEY
          - adapter: brightdata
            secret: BRIGHTDATA_KEY
          - adapter: firecrawl
            secret: FIRECRAWL_KEY
    steps:
      # `persist-credentials: false`, so no credential is left in the workspace `.git/config`
      # for `pnpm install` or a provider response to reach. Nothing here pushes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Dormant rather than red when a key is absent, the same call the canary makes above and
      # for the same reason: a weekly failure nobody can act on is how a real one stops being
      # read. Per adapter, so three keys do not go dark because the fourth is missing.
      - id: keyed
        env:
          KEY: ${{ secrets[matrix.secret] }}
        run: |
          if [ -n "$KEY" ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=record-diff::No ${{ matrix.adapter }} key, so its fixtures were not checked for drift this week. Add ${{ matrix.secret }} to repository secrets."
          fi
      # Spends credits: one request per category. That is the price of knowing.
      - if: steps.keyed.outputs.yes == 'true'
        env:
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          SCRAPINGBEE_KEY: ${{ secrets.SCRAPINGBEE_KEY }}
          SCRAPFLY_KEY: ${{ secrets.SCRAPFLY_KEY }}
          BRIGHTDATA_KEY: ${{ secrets.BRIGHTDATA_KEY }}
          FIRECRAWL_KEY: ${{ secrets.FIRECRAWL_KEY }}
        id: diff
        # `shell: bash`, which GitHub runs as `bash -eo pipefail`. The implicit default is
        # `bash -e` with NO pipefail, so `record ... | tee` exited with tee's 0 and this step went
        # green on real drift. The 2026-09-16 run printed "3 fixture(s) changed shape" and
        # "Command failed with exit code 1" on all four adapters, reported success on all four,
        # and the issue step below never fired. The tee was here all along; #285 copied it onto
        # the deadline pass and silenced that one too.
        shell: bash
        run: pnpm record --diff --adapter=${{ matrix.adapter }} 2>&1 | tee /tmp/diff.txt
      # A SECOND, SCOPED PASS, because `--timeout-ms` is global and would time out every other
      # category. Without it `deadline` is skipped — it needs a budget below the target's 30s
      # delay — so `deadline.json` sat exempt from drift detection every single week while the
      # report called everything else confirmed. `--diff` now names what it skipped rather than
      # passing over it in silence; this is what stops it having anything to name.
      #
      # HAS AN ID AND A TEE, because for three weeks it did not. The drift-issue step below
      # keyed on `steps.diff` alone, so this pass could fail — and did, on every adapter, every
      # Wednesday from 08-26 — with no signal beyond a red square on a page nobody opens. A
      # scheduled job's second step is exactly as invisible as its first, and needs the same wiring.
      - if: steps.keyed.outputs.yes == 'true'
        id: deadline
        env:
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          SCRAPINGBEE_KEY: ${{ secrets.SCRAPINGBEE_KEY }}
          SCRAPFLY_KEY: ${{ secrets.SCRAPFLY_KEY }}
          BRIGHTDATA_KEY: ${{ secrets.BRIGHTDATA_KEY }}
          FIRECRAWL_KEY: ${{ secrets.FIRECRAWL_KEY }}
        # pipefail, for the reason on the step above.
        shell: bash
        run: pnpm record --diff --adapter=${{ matrix.adapter }} --only=deadline --timeout-ms=5000 2>&1 | tee /tmp/diff-deadline.txt
      # DRIFT OPENS AN ISSUE, because a red job in a scheduled run is a thing nobody sees.
      #
      # The canary has done this since it was written; this job did not, and the gap showed:
      # on 2026-08-26 three of four adapters failed here and it went unnoticed until somebody
      # went looking days later. A weekly check whose only signal is a red square on a page no
      # one opens is a check that has stopped running, in every sense that matters.
      #
      # One issue per adapter, and a comment rather than a duplicate on the next run — the same
      # shape the canary needed after eight identical issues in one morning. Drift is a fact
      # about one provider and stays true until somebody re-records.
      #
      # `always()` because the step it reports on has just failed, and `continue-on-error` is
      # deliberately NOT used: the job must still end red, or the launch gate and the weekly
      # board would both call this green.
      #
      # EITHER PASS, and this step sits BELOW both, which is not where it used to be. It was
      # between them, so `steps.deadline.outcome` would have been read before that step ran and
      # always been empty — the condition would have looked right and matched nothing. A pass
      # that did not run leaves no file, so `cat` of a missing one is silenced rather than fatal.
      - if: always() && (steps.diff.outcome == 'failure' || steps.deadline.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          A="${{ matrix.adapter }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # The shape diff itself, which is the whole point: "it failed" sends someone to the
          # logs, "post.json: -body.headers.Referer" tells them what moved before they open one.
          DETAIL="$(cat /tmp/diff.txt /tmp/diff-deadline.txt 2>/dev/null | sed -n '/changed shape/,$p' | head -30)"
          EXISTING="$(gh issue list --label flag:provider-drift --state open --search "$A in:title" \
            --json number --jq '.[0].number // empty')"
          BODY="$(printf 'Fixture shape changed for %s.\n\n```\n%s\n```\n\nRun: %s\n\nRe-record with `pnpm record --adapter=%s` and read the diff before committing it. A provider changing its response shape is what breaks `parse()`; a TEST TARGET changing what it echoes is not, and the two look identical here.' "$A" "$DETAIL" "$RUN_URL" "$A")"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "fixture drift: $A" --label "flag:provider-drift" --body "$BODY"
          fi
      # An identical re-recording renews the fixture's date, but only once it is 30 days old, so
      # this opens a pull request roughly monthly rather than weekly. Without it the renewal is
      # discarded with the runner and `repo:check`'s freshness assertion ages out fixtures that
      # were in fact confirmed days earlier.
      # The renewal travels as an artifact, because the job that pushes it must not be this
      # one. `--diff` writes fresh recordings to a temp dir and touches the repository in
      # exactly one place: `recordedAt` on a fixture that re-recorded byte-identically.
      - id: renewed
        if: always() && steps.keyed.outputs.yes == 'true'
        shell: bash
        run: |
          FIXTURES="packages/adapters/src/${{ matrix.adapter }}/fixtures"
          if git diff --quiet -- "$FIXTURES"; then
            echo "yes=false" >> "$GITHUB_OUTPUT"
          else
            echo "yes=true" >> "$GITHUB_OUTPUT"
          fi
      # `always()`, so a drift failure above does not also discard a renewal that did happen.
      - if: always() && steps.renewed.outputs.yes == 'true'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: fixtures-${{ matrix.adapter }}
          path: packages/adapters/src/${{ matrix.adapter }}/fixtures
          if-no-files-found: error
          retention-days: 7

  # The half that writes. Separated from the recording deliberately: this job runs no
  # workspace code, installs nothing, and talks to no provider, so the only thing its token
  # can be reached by is this file.
  #
  # WHY A TOKEN AT ALL. GitHub starts no workflow run for anything `GITHUB_TOKEN` does, so a
  # branch pushed and a pull request opened with it arrive with no CI, and `main`'s ruleset
  # requires the checks with no bypass actor. #358 sat at "no checks reported" until somebody
  # made the checks exist by hand. `release.yml` hit this first; this is its fix, its App, and
  # no second credential.
  fixture-dates:
    needs: record-diff
    # `always()`, for the reason the upload above has it: drift on one adapter must not
    # discard another's renewal. `needs` still guarantees the recording finished.
    if: always() && needs.record-diff.result != 'skipped'
    runs-on: ubuntu-latest
    env:
      # `secrets` cannot be read in a step `if:`, so the presence test is hoisted to `env`.
      HAS_APP: ${{ (secrets.RELEASE_APP_CLIENT_ID != '' || secrets.RELEASE_APP_ID != '') && secrets.RELEASE_APP_PRIVATE_KEY != '' }}
      HAS_CLIENT_ID: ${{ secrets.RELEASE_APP_CLIENT_ID != '' }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      # MINTED BEFORE THE CHECKOUT, because the checkout is what decides the push identity.
      # `actions/checkout` persists its token as an `http.extraheader` in the workspace
      # `.git/config`, and that header is sent on every push to github.com whatever the remote
      # URL says, so a credential smuggled into the URL at push time loses to it silently and
      # the push stays `github-actions[bot]`. `release.yml` says the same in its own words:
      # push and pull request must agree, or the run is still suppressed.
      #
      # `permission-*` narrows the installation token to the two permissions this job uses.
      # The App also holds `packages: write` for ghcr, which has no business being live here.
      #
      # TWO STEPS, ONE OF WHICH RUNS. `client-id` and `app-id` take different values, not two
      # spellings of one; the comment in `release.yml` has the detail.
      - name: mint a token that is not the Actions token
        id: app_client
        if: env.HAS_APP == 'true' && env.HAS_CLIENT_ID == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: mint a token that is not the Actions token (legacy app id)
        id: app_legacy
        if: env.HAS_APP == 'true' && env.HAS_CLIENT_ID != 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app_client.outputs.token || steps.app_legacy.outputs.token || secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        id: renewals
        continue-on-error: true # no adapter renewed anything this week, which is the norm
        with:
          pattern: fixtures-*
          path: /tmp/renewed
      # THE GUARD IS THE TOKEN, NOT THE CONFIGURATION. `HAS_APP` says the secrets are set;
      # what decides whether CI will run is which token the checkout above actually used, and
      # those are two different facts joined by a `||`. The day they disagree — an empty mint
      # output, a `continue-on-error` added later, a third mint path — a `HAS_APP` guard would
      # suppress the warning on exactly the run that needed it, which is the inert fix this
      # job exists to avoid, with its alarm turned off.
      - if: steps.renewals.outcome == 'success'
        env:
          APP_TOKEN: ${{ steps.app_client.outputs.token || steps.app_legacy.outputs.token }}
          APP_SLUG: ${{ steps.app_client.outputs.app-slug || steps.app_legacy.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app_client.outputs.token || steps.app_legacy.outputs.token || github.token }}
        shell: bash
        run: |
          shopt -s nullglob

          # The commit is authored by whoever pushes it. `main`'s ruleset sets
          # `require_extra_approval_for_unattributed_changes`, so a commit authored by one bot
          # and pushed by another is the shape that asks for a human. Attribute both to the
          # same identity.
          if [ -n "$APP_TOKEN" ]; then
            BOT_ID="$(gh api "users/${APP_SLUG}[bot]" --jq .id)"
            git config user.name "${APP_SLUG}[bot]"
            git config user.email "${BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi

          for dir in /tmp/renewed/fixtures-*; do
            ADAPTER="${dir##*/fixtures-}"
            FIXTURES="packages/adapters/src/$ADAPTER/fixtures"
            [ -d "$FIXTURES" ] || { echo "::warning::no fixtures directory for $ADAPTER"; continue; }

            git checkout -- . && git checkout main
            cp "$dir"/* "$FIXTURES"/
            git diff --quiet -- "$FIXTURES" && continue

            BRANCH="chore/fixture-dates-$ADAPTER"
            git checkout -B "$BRANCH"
            # Scoped, not `-a`. These pull requests merge with no approving review required,
            # so "every modified tracked file" is the wrong blast radius for a robot commit.
            git commit -m "chore(adapters): renew $ADAPTER fixture dates" -- "$FIXTURES"
            git push -f origin "$BRANCH"

            # `gh pr list --state open`, NOT `gh pr view`. The branch name is stable per
            # adapter and this force-pushes it every month, and `gh pr view` resolves a branch
            # to a MERGED pull request too: after #358 merged, `gh pr view
            # chore/fixture-dates-brightdata` still exits 0. The old guard would have pushed
            # the branch, found the merged pull request, skipped `gh pr create` and exited
            # green having opened nothing. That state was unreachable while these pull
            # requests could not merge; fixing the merge is what arms it.
            OPEN="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
            [ -n "$OPEN" ] && continue

            NOTE=""
            if [ -z "$APP_TOKEN" ]; then
              NOTE=$'\n\n**No CI will run on this pull request.** It was opened with the Actions token, and GitHub starts no workflow for what that token does. Close it and reopen it — `ci.yml` lists `reopened` among its triggers — or install the release App so this job stops producing unmergeable pull requests.'
              echo "::warning title=fixture-dates::No App token, so the $ADAPTER pull request opens without CI and cannot merge until somebody closes and reopens it."
            fi

            gh pr create --base main --head "$BRANCH" \
              --title "chore(adapters): renew $ADAPTER fixture dates" \
              --body "These fixtures re-recorded byte-identically, so only \`recordedAt\` moved. Opened by the weekly \`record-diff\` job.$NOTE"
          done

  # Provenance for the published health figures.
  #
  # `repo:check` assertion 21 asserts the DOCS agree with `scripts/health-numbers.json`, and
  # that the recording is newer than the code it measures. What it cannot check is that the
  # file was produced by the simulation at all: it is a tracked, hand-editable JSON, so
  # restating a remembered figure in both places passes. A verification panel demonstrated
  # exactly that.
  #
  # This closes it by actually running the thing. Weekly rather than per-PR because the sim
  # takes minutes and `repo:check` runs on every commit — and drift is a slow failure, not one
  # that needs catching within the hour.
  health-sim:
    if: github.event.schedule == '41 6 * * 4' || inputs.job == 'health-sim'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - name: rerun the simulation and diff the recorded figures
        run: |
          set -euo pipefail
          node scripts/health-sim.ts > /tmp/sim.txt
          if ! git diff --quiet -- scripts/health-numbers.json; then
            echo "::error::scripts/health-numbers.json does not match a fresh simulation run."
            git --no-pager diff -- scripts/health-numbers.json
            echo "The published figures were not produced by the simulation, or the simulation"
            echo "has changed. Rerun \`node scripts/health-sim.ts\` and update the prose."
            exit 1
          fi
          echo "recorded figures reproduce exactly"

  # The full self-host path, weekly.
  #
  # `build-docker` on every PR boots the built image and drives its HTTP surface, which is the
  # cheap half and catches the class of rot that left `pnpm dev` broken. This is the expensive
  # half: a clean context, the shipped compose file, and the five-minute claim from
  # `plan.md` — "a stranger self-hosts in under five minutes" — actually timed.
  #
  # Weekly rather than per-PR because it builds from scratch by design. A smoke test that
  # reuses a warm dist proves the developer's machine works, not that a stranger's does.
  selfhost-smoke:
    if: github.event.schedule == '53 6 * * 5' || inputs.job == 'selfhost-smoke'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - run: pnpm selfhost:smoke
      - name: open an issue when the self-host path breaks
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            // The audience for this failure is a stranger who cannot file it themselves,
            // because for them the product simply did not work.
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'selfhost:smoke failed — the documented install path is broken',
              body: [
                'The weekly self-host smoke failed. Someone following `docs/self-hosting.md`',
                'right now is hitting whatever this is.',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n'),
              labels: ['bug'],
            })
