name: scheduled

# Three crons in one file rather than three files. All are stubs today and say so by
# failing honestly — the commands they run exit 1 naming their owner and blocking file.
on:
  schedule:
    - cron: '17 6 * * 1'   # canary:live   — weekly at launch, nightly once revenue exists
    - cron: '23 6 * * 2'   # cost-drift    — weekly
    - cron: '29 6 * * 3'   # record:diff   — weekly
    - cron: '41 6 * * 4'   # health-sim    — weekly
    - cron: '53 6 * * 5'   # selfhost:smoke — weekly
  workflow_dispatch:
    inputs:
      job:
        description: which job to run
        type: choice
        options: [canary, cost-drift, record-diff, health-sim, selfhost-smoke]

permissions:
  contents: read
  issues: write

jobs:
  canary:
    if: github.event.schedule == '17 6 * * 1' || inputs.job == 'canary'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # test:live is a stub that exits 1. Without this the canary opens a provider-drift
      # issue every Monday from day one — and a weekly false alarm is how a real one stops
      # being read.
      - id: implemented
        shell: bash
        run: |
          node -e 'process.exit(require("./scripts/commands.json")["test:live"].status === "implemented" ? 0 : 1)' \
            && echo "yes=true" >> "$GITHUB_OUTPUT" \
            || { echo "yes=false" >> "$GITHUB_OUTPUT"; echo "::notice::test:live is still a stub; canary is dormant"; }
      # A second dormancy gate, for a different reason than the first. test:live is now
      # implemented, so the stub guard above passes — but the canary needs real provider
      # keys, and without them it fails with "no provider keys" every single Monday. That is
      # the same weekly false alarm the guard above exists to prevent, arriving by another
      # route, and a canary nobody reads is worse than no canary.
      - id: keyed
        shell: bash
        env:
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          SCRAPINGBEE_KEY: ${{ secrets.SCRAPINGBEE_KEY }}
          SCRAPFLY_KEY: ${{ secrets.SCRAPFLY_KEY }}
        run: |
          if [ -n "$SCRAPERAPI_KEY" ] || [ -n "$SCRAPINGBEE_KEY" ] || [ -n "$SCRAPFLY_KEY" ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=canary::No provider key secrets are set, so the canary is dormant. The three-week launch gate clock has NOT started. Add SCRAPERAPI_KEY, SCRAPINGBEE_KEY or SCRAPFLY_KEY."
          fi
      - id: run
        if: steps.implemented.outputs.yes == 'true' && steps.keyed.outputs.yes == 'true'
        continue-on-error: true
        env:
          # Trial-account keys, per operations.md. Absent on a fork PR by design — GitHub
          # does not expose secrets there, which is what makes it structurally impossible to
          # burn credits on a community contribution.
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          SCRAPINGBEE_KEY: ${{ secrets.SCRAPINGBEE_KEY }}
          SCRAPFLY_KEY: ${{ secrets.SCRAPFLY_KEY }}
        run: pnpm test:live
      - if: steps.keyed.outputs.yes == 'true' && steps.run.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A failing canary means a provider changed under us. That is the signal the
          # whole adapter layer exists to surface, so it opens an issue rather than
          # turning a scheduled run red where nobody looks.
          gh issue create --title "provider drift: canary failed $(date -u +%F)" \
            --label "flag:provider-drift" \
            --body "\`pnpm test:live\` failed on the scheduled canary. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || echo "::warning::could not open an issue (labels may not exist yet)"

  cost-drift:
    if: github.event.schedule == '23 6 * * 2' || inputs.job == 'cost-drift'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: echo "::notice::cost-drift needs the ledger and a cost table with reported values; neither exists"

  record-diff:
    if: github.event.schedule == '29 6 * * 3' || inputs.job == 'record-diff'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm record --diff || echo "::notice::record is a stub; nothing to diff yet"

  # Provenance for the published health figures.
  #
  # `repo:check` assertion 21 asserts the DOCS agree with `scripts/health-numbers.json`, and
  # that the recording is newer than the code it measures. What it cannot check is that the
  # file was produced by the simulation at all: it is a tracked, hand-editable JSON, so
  # restating a remembered figure in both places passes. A verification panel demonstrated
  # exactly that.
  #
  # This closes it by actually running the thing. Weekly rather than per-PR because the sim
  # takes minutes and `repo:check` runs on every commit — and drift is a slow failure, not one
  # that needs catching within the hour.
  health-sim:
    if: github.event.schedule == '41 6 * * 4' || inputs.job == 'health-sim'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: rerun the simulation and diff the recorded figures
        run: |
          set -euo pipefail
          node scripts/health-sim.ts > /tmp/sim.txt
          if ! git diff --quiet -- scripts/health-numbers.json; then
            echo "::error::scripts/health-numbers.json does not match a fresh simulation run."
            git --no-pager diff -- scripts/health-numbers.json
            echo "The published figures were not produced by the simulation, or the simulation"
            echo "has changed. Rerun \`node scripts/health-sim.ts\` and update the prose."
            exit 1
          fi
          echo "recorded figures reproduce exactly"

  # The full self-host path, weekly.
  #
  # `build-docker` on every PR boots the built image and drives its HTTP surface, which is the
  # cheap half and catches the class of rot that left `pnpm dev` broken. This is the expensive
  # half: a clean context, the shipped compose file, and the five-minute claim from
  # `plan.md` — "a stranger self-hosts in under five minutes" — actually timed.
  #
  # Weekly rather than per-PR because it builds from scratch by design. A smoke test that
  # reuses a warm dist proves the developer's machine works, not that a stranger's does.
  selfhost-smoke:
    if: github.event.schedule == '53 6 * * 5' || inputs.job == 'selfhost-smoke'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm selfhost:smoke
      - name: open an issue when the self-host path breaks
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            // The audience for this failure is a stranger who cannot file it themselves,
            // because for them the product simply did not work.
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'selfhost:smoke failed — the documented install path is broken',
              body: [
                'The weekly self-host smoke failed. Someone following `docs/self-hosting.md`',
                'right now is hitting whatever this is.',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n'),
              labels: ['bug'],
            })
