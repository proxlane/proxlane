name: scheduled

# Three crons in one file rather than three files. All are stubs today and say so by
# failing honestly — the commands they run exit 1 naming their owner and blocking file.
on:
  schedule:
    - cron: '17 6 * * 1'   # canary:live   — weekly at launch, nightly once revenue exists
    - cron: '23 6 * * 2'   # cost-drift    — weekly
    - cron: '29 6 * * 3'   # record:diff   — weekly
    - cron: '41 6 * * 4'   # health-sim    — weekly
    - cron: '53 6 * * 5'   # selfhost:smoke — weekly
  workflow_dispatch:
    inputs:
      job:
        description: which job to run
        type: choice
        options: [canary, cost-drift, record-diff, health-sim, selfhost-smoke]

permissions:
  contents: read
  issues: write

jobs:
  canary:
    if: github.event.schedule == '17 6 * * 1' || inputs.job == 'canary'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # test:live is a stub that exits 1. Without this the canary opens a provider-drift
      # issue every Monday from day one — and a weekly false alarm is how a real one stops
      # being read.
      - id: implemented
        shell: bash
        run: |
          node -e 'process.exit(require("./scripts/commands.json")["test:live"].status === "implemented" ? 0 : 1)' \
            && echo "yes=true" >> "$GITHUB_OUTPUT" \
            || { echo "yes=false" >> "$GITHUB_OUTPUT"; echo "::notice::test:live is still a stub; canary is dormant"; }
      # A second dormancy gate, for a different reason than the first. test:live is now
      # implemented, so the stub guard above passes — but the canary needs real provider
      # keys, and without them it fails with "no provider keys" every single Monday. That is
      # the same weekly false alarm the guard above exists to prevent, arriving by another
      # route, and a canary nobody reads is worse than no canary.
      - id: keyed
        shell: bash
        env:
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          SCRAPINGBEE_KEY: ${{ secrets.SCRAPINGBEE_KEY }}
          SCRAPFLY_KEY: ${{ secrets.SCRAPFLY_KEY }}
          BRIGHTDATA_KEY: ${{ secrets.BRIGHTDATA_KEY }}
        run: |
          if [ -n "$SCRAPERAPI_KEY" ] || [ -n "$SCRAPINGBEE_KEY" ] || [ -n "$SCRAPFLY_KEY" ] || [ -n "$BRIGHTDATA_KEY" ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=canary::No provider key secrets are set, so the canary is dormant. The three-week launch gate clock has NOT started. Add SCRAPERAPI_KEY, SCRAPINGBEE_KEY, SCRAPFLY_KEY or BRIGHTDATA_KEY."
          fi
      - id: run
        if: steps.implemented.outputs.yes == 'true' && steps.keyed.outputs.yes == 'true'
        continue-on-error: true
        env:
          # Trial-account keys, per operations.md. Absent on a fork PR by design — GitHub
          # does not expose secrets there, which is what makes it structurally impossible to
          # burn credits on a community contribution.
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          SCRAPINGBEE_KEY: ${{ secrets.SCRAPINGBEE_KEY }}
          SCRAPFLY_KEY: ${{ secrets.SCRAPFLY_KEY }}
          # The fourth adapter. Without it `test:live` generated zero tests for Bright Data
          # and the canary went green anyway — a blind spot the size of a whole provider.
          BRIGHTDATA_KEY: ${{ secrets.BRIGHTDATA_KEY }}
        run: pnpm test:live
      - if: steps.keyed.outputs.yes == 'true' && steps.run.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # NO `|| echo` HERE. An alert that cannot be delivered is the same as no alert,
          # and this one could not be for eleven weeks: `flag:provider-drift` had never been
          # created, `gh` resolves label names server-side and errors when one is missing, and
          # the `|| echo` turned that into a warning on a run `continue-on-error` had already
          # made green. Assertion 40 now holds every `--label` to `.github/labels.json`; this
          # is the second guard, for what an offline check cannot see.
          #
          # A failing canary means a provider changed under us. That is the signal the
          # whole adapter layer exists to surface, so it opens an issue rather than
          # turning a scheduled run red where nobody looks.
          #
          # ONE ISSUE, NOT ONE PER RUN. This was an unconditional `gh issue create`, and eight
          # canary runs in a single morning opened eight identical issues on a public repo —
          # the whole open-issue list, all dated the same day, all the same failure. To a
          # visitor that reads as a project falling over rather than as one provider being
          # misconfigured. A drift issue is about a provider that changed, and it stays true
          # until somebody closes it, so a second run finding the same thing has nothing new
          # to say: it comments on the open one and moves on.
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING="$(gh issue list --label flag:provider-drift --state open \
            --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Still failing. Run: $RUN_URL"
          else
            gh issue create --title "provider drift: canary failed $(date -u +%F)" \
              --label "flag:provider-drift" \
              --body "\`pnpm test:live\` failed on the scheduled canary. Run: $RUN_URL"
          fi
      # THE LAUNCH GATE READS THE STEP, NOT THE JOB. `continue-on-error: true` above makes the
      # job green whether the canary passed or failed — by design, so drift opens an issue
      # rather than reddening a scheduled run nobody looks at. But `state.md` counts "three
      # consecutive scheduled greens" as operations.md section 9's launch gate, and under that
      # setting a green is not evidence the canary passed. This makes the two differ.
      - if: steps.run.outcome == 'failure'
        run: |
          echo "::error title=canary::test:live failed. This run does NOT count toward the three consecutive greens in operations.md section 9."
          exit 1

  cost-drift:
    if: github.event.schedule == '23 6 * * 2' || inputs.job == 'cost-drift'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: echo "::notice::cost-drift needs the ledger and a cost table with reported values; neither exists"

  # Re-record every fixture and compare. This is the only thing in the repo that can notice a
  # provider changing its response shape underneath us.
  #
  # IT RAN FOR WEEKS WITHOUT COMPARING ANYTHING. The step was
  # `pnpm record --diff || echo "::notice::record is a stub; nothing to diff yet"`, and `--diff`
  # existed nowhere in `scripts/record.ts` — so it exited 2 on the missing `--adapter`, the
  # `|| echo` swallowed that, and the job went green every Wednesday. It also had no provider
  # keys, so it could not have worked even if the flag had existed. Two independent failures,
  # either one sufficient, in six lines of YAML.
  #
  # `|| echo` is gone. Drift fails the job.
  record-diff:
    if: github.event.schedule == '29 6 * * 3' || inputs.job == 'record-diff'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        # The secret name is carried explicitly rather than derived from the adapter id. The
        # `secrets` context is looked up by an exact name, and `record.ts` derives its env var
        # by uppercasing — so a matrix of lowercase ids would silently find nothing and every
        # leg would report itself dormant, which reads exactly like "no keys configured".
        include:
          - adapter: scraperapi
            secret: SCRAPERAPI_KEY
          - adapter: scrapingbee
            secret: SCRAPINGBEE_KEY
          - adapter: scrapfly
            secret: SCRAPFLY_KEY
          - adapter: brightdata
            secret: BRIGHTDATA_KEY
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Dormant rather than red when a key is absent, the same call the canary makes above and
      # for the same reason: a weekly failure nobody can act on is how a real one stops being
      # read. Per adapter, so three keys do not go dark because the fourth is missing.
      - id: keyed
        env:
          KEY: ${{ secrets[matrix.secret] }}
        run: |
          if [ -n "$KEY" ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=record-diff::No ${{ matrix.adapter }} key, so its fixtures were not checked for drift this week. Add ${{ matrix.secret }} to repository secrets."
          fi
      # Spends credits: one request per category. That is the price of knowing.
      - if: steps.keyed.outputs.yes == 'true'
        env:
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          SCRAPINGBEE_KEY: ${{ secrets.SCRAPINGBEE_KEY }}
          SCRAPFLY_KEY: ${{ secrets.SCRAPFLY_KEY }}
          BRIGHTDATA_KEY: ${{ secrets.BRIGHTDATA_KEY }}
        run: pnpm record --diff --adapter=${{ matrix.adapter }}
      # A SECOND, SCOPED PASS, because `--timeout-ms` is global and would time out every other
      # category. Without it `deadline` is skipped — it needs a budget below the target's 30s
      # delay — so `deadline.json` sat exempt from drift detection every single week while the
      # report called everything else confirmed. `--diff` now names what it skipped rather than
      # passing over it in silence; this is what stops it having anything to name.
      - if: steps.keyed.outputs.yes == 'true'
        env:
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          SCRAPINGBEE_KEY: ${{ secrets.SCRAPINGBEE_KEY }}
          SCRAPFLY_KEY: ${{ secrets.SCRAPFLY_KEY }}
          BRIGHTDATA_KEY: ${{ secrets.BRIGHTDATA_KEY }}
        run: pnpm record --diff --adapter=${{ matrix.adapter }} --only=deadline --timeout-ms=5000
      # An identical re-recording renews the fixture's date, but only once it is 30 days old, so
      # this opens a pull request roughly monthly rather than weekly. Without it the renewal is
      # discarded with the runner and `repo:check`'s freshness assertion ages out fixtures that
      # were in fact confirmed days earlier.
      - if: steps.keyed.outputs.yes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet && exit 0
          BRANCH="chore/fixture-dates-${{ matrix.adapter }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -am "chore(adapters): renew ${{ matrix.adapter }} fixture dates"
          git push -f origin "$BRANCH"
          gh pr view "$BRANCH" >/dev/null 2>&1 || gh pr create --base main --head "$BRANCH" \
            --title "chore(adapters): renew ${{ matrix.adapter }} fixture dates" \
            --body "These fixtures re-recorded byte-identically, so only \`recordedAt\` moved. Opened by the weekly \`record-diff\` job."

  # Provenance for the published health figures.
  #
  # `repo:check` assertion 21 asserts the DOCS agree with `scripts/health-numbers.json`, and
  # that the recording is newer than the code it measures. What it cannot check is that the
  # file was produced by the simulation at all: it is a tracked, hand-editable JSON, so
  # restating a remembered figure in both places passes. A verification panel demonstrated
  # exactly that.
  #
  # This closes it by actually running the thing. Weekly rather than per-PR because the sim
  # takes minutes and `repo:check` runs on every commit — and drift is a slow failure, not one
  # that needs catching within the hour.
  health-sim:
    if: github.event.schedule == '41 6 * * 4' || inputs.job == 'health-sim'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: rerun the simulation and diff the recorded figures
        run: |
          set -euo pipefail
          node scripts/health-sim.ts > /tmp/sim.txt
          if ! git diff --quiet -- scripts/health-numbers.json; then
            echo "::error::scripts/health-numbers.json does not match a fresh simulation run."
            git --no-pager diff -- scripts/health-numbers.json
            echo "The published figures were not produced by the simulation, or the simulation"
            echo "has changed. Rerun \`node scripts/health-sim.ts\` and update the prose."
            exit 1
          fi
          echo "recorded figures reproduce exactly"

  # The full self-host path, weekly.
  #
  # `build-docker` on every PR boots the built image and drives its HTTP surface, which is the
  # cheap half and catches the class of rot that left `pnpm dev` broken. This is the expensive
  # half: a clean context, the shipped compose file, and the five-minute claim from
  # `plan.md` — "a stranger self-hosts in under five minutes" — actually timed.
  #
  # Weekly rather than per-PR because it builds from scratch by design. A smoke test that
  # reuses a warm dist proves the developer's machine works, not that a stranger's does.
  selfhost-smoke:
    if: github.event.schedule == '53 6 * * 5' || inputs.job == 'selfhost-smoke'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm selfhost:smoke
      - name: open an issue when the self-host path breaks
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            // The audience for this failure is a stranger who cannot file it themselves,
            // because for them the product simply did not work.
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'selfhost:smoke failed — the documented install path is broken',
              body: [
                'The weekly self-host smoke failed. Someone following `docs/self-hosting.md`',
                'right now is hitting whatever this is.',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n'),
              labels: ['bug'],
            })
