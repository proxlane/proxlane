# Self-host. One command, one service.
#
#   cp .env.example .env && $EDITOR .env
#   docker compose -f docker/compose.yml --env-file .env up -d --build
#
# --env-file IS REQUIRED and this header used to omit it. Compose derives the project
# directory from the first -f file, so it looks for docker/.env and never reads the root .env
# the line above just created — the run fails on the PROXLANE_API_KEY interpolation below.
#
# ONE SERVICE, and that is not an omission. The gateway currently touches no database: no
# request log, no cooldown state, no key store. Shipping Postgres and Valkey here because
# the architecture will eventually need them would mean a self-hoster runs two containers
# that nothing connects to, and debugs them when they fail. They arrive in the release that
# uses them. `docker/compose.dev.yml` is the dev stack and is not a deployment artifact.

name: proxlane

services:
  gateway:
    build:
      context: ..
      dockerfile: Dockerfile
    # PINNED, and `operating.md` B8 has always said this file pins while it actually said
    # `:latest`. That was not cosmetic: `:latest` moves, so a `docker compose pull` could change
    # the running gateway without anyone choosing to — and for a while it moved to builds that
    # were never released at all, because the release tagged images with the version changesets
    # had staged rather than the one it shipped (fixed in #114).
    #
    # A pin that LAGS the newest release is correct, not stale. A self-hoster wants a version
    # somebody ran, and bumping this is a deliberate act with a changelog to read first.
    # `repo:check` asserts only that it is a concrete version that was actually released.
    image: ghcr.io/proxlane/gateway:0.14.2
    restart: unless-stopped
    ports:
      - '${PORT:-8787}:8787'
    environment:
      # Authenticates callers TO this gateway. No default, on purpose: the server refuses
      # to boot without it, because a gateway started open is a proxy funded by whoever
      # deployed it.
      PROXLANE_API_KEY: ${PROXLANE_API_KEY:?set PROXLANE_API_KEY in .env — see .env.example}
      # BYOK. Bring the providers you actually pay for; the rest are simply not in the
      # chain. None set is allowed: the gateway warns, boots, and answers
      # NO_PROVIDER_AVAILABLE, rather than crash-looping someone who has not signed up yet.
      SCRAPERAPI_KEY: ${SCRAPERAPI_KEY:-}
      SCRAPINGBEE_KEY: ${SCRAPINGBEE_KEY:-}
      SCRAPFLY_KEY: ${SCRAPFLY_KEY:-}
      BRIGHTDATA_KEY: ${BRIGHTDATA_KEY:-}
      PROXLANE_DEADLINE_MS: ${PROXLANE_DEADLINE_MS:-120000}
      PROXLANE_BODY_CAP_MB: ${PROXLANE_BODY_CAP_MB:-10}
      # Concurrent /v1 requests before the gateway answers 429 GATEWAY_BUSY. Sheds rather
      # than queues, and never applies to /health — an orchestrator must not restart a
      # gateway whose only problem is that it is busy. Sized against the memory limit
      # below: maxInflight * bodyCapMb * 2.5 should fit inside it.
      PROXLANE_MAX_INFLIGHT: ${PROXLANE_MAX_INFLIGHT:-32}
      # Only needed when no cgroup limit is readable, or to declare a different one. The
      # gateway refuses to boot if maxInflight x bodyCap x 2.5 does not fit inside it, because
      # the alternative is an OOM kill with nothing in our logs to explain it.
      PROXLANE_MEMORY_LIMIT_MB: ${PROXLANE_MEMORY_LIMIT_MB:-}
      # Routing state. These four were documented in .env.example and NOT listed here, so
      # setting them did nothing on the one deployment path this project ships: compose only
      # passes a variable into the container if it is named in this block.
      #
      # Cooldowns are on unless set to `off`; health is OFF unless set to `on`, because its
      # calibration assumes failures that do not clump the way real ones do. Both live in the
      # gateway process
      # unless PROXLANE_VALKEY_URL is set, which is what makes more than one replica possible;
      # without it the server refuses to boot with PROXLANE_REPLICAS>1 rather than let two
      # replicas demote independently. Uncomment the `valkey` service below alongside the URL.
      #
      # Note `${VAR:-}` sets the variable to an empty string rather than leaving it unset, so
      # the gateway treats empty as absent. It has to: compose cannot express "unset".
      # Extra goes at the LAST provider only, where there is nothing to fail over to.
      PROXLANE_TERMINAL_RETRIES: ${PROXLANE_TERMINAL_RETRIES:-1}
      PROXLANE_LOG: ${PROXLANE_LOG:-}
      PROXLANE_LOG_URLS: ${PROXLANE_LOG_URLS:-}
      PROXLANE_HEALTH: ${PROXLANE_HEALTH:-}
      PROXLANE_COOLDOWNS: ${PROXLANE_COOLDOWNS:-}
      PROXLANE_REPLICAS: ${PROXLANE_REPLICAS:-}
      PROXLANE_VALKEY_URL: ${PROXLANE_VALKEY_URL:-}
      PROXLANE_ORG_ID: ${PROXLANE_ORG_ID:-}
      PROXLANE_PROVIDER_ORDER: ${PROXLANE_PROVIDER_ORDER:-}
    # No depends_on, even when the valkey service below is uncommented. Both stores fail OPEN,
    # so a gateway that starts first routes correctly without them and picks them up when they
    # arrive — verified by killing Valkey under a running gateway and watching it self-heal.
    # An ordering constraint would buy nothing and would turn a Valkey restart into a gateway
    # restart.
    healthcheck:
      # Node, not curl: the alpine image has no curl and adding one to satisfy a healthcheck
      # is a package installed for the benefit of the healthcheck alone.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # Uncomment together with PROXLANE_VALKEY_URL above to run more than one gateway.
  #
  # Not on by default: self-host is one process, and a mandatory Valkey adds a service, a
  # failure mode and a restart ordering problem to a deployment that does not need one. Both
  # stores fail OPEN when it is unreachable, so the cost of it being down is worse routing
  # rather than a refused request.
  #
  # valkey:
  #   image: valkey/valkey:8-alpine
  #   restart: unless-stopped
  #   # No persistence: everything in here is reconstructible. noeviction rather than
  #   # allkeys-lru because silently evicting state is worse than refusing to store more.
  #   command: >-
  #     valkey-server --save "" --appendonly no
  #     --maxmemory 256mb --maxmemory-policy noeviction
  #   healthcheck:
  #     test: ['CMD', 'valkey-cli', 'ping']
  #     interval: 5s
  #     timeout: 3s
  #     retries: 10

