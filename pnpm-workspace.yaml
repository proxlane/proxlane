packages:
  - apps/*
  - packages/*
  - tooling/*
  - scripts

# Every npm dependency routes through the catalog. A package cannot add an unpinned
# dependency without adding a key here, and repo:check asserts this list against the
# `kind: npm` rows of the pinned-toolchain table in CLAUDE.md.
#
# Versions resolved from the registry 2026-08-06. Do not bump by hand without checking
# the Why column in CLAUDE.md — two of these are deliberately not latest.
catalog:
  # runtime — the gateway hot path
  
  # web
  '@base-ui/react': ^1.6.0
  '@biomejs/biome': ^2.5
  '@changesets/cli': ^2.31
  '@lhci/cli': ^0.15
  '@hono/node-server': ^2.1
  '@tanstack/react-start': ^1.168
  '@tanstack/react-router': ^1.170
  '@tanstack/router-plugin': ^1.168
  '@tailwindcss/vite': ^4.3
  '@vitejs/plugin-react': ^6.0
  '@fontsource-variable/hanken-grotesk': ^5.3
  '@fontsource/ibm-plex-mono': ^5.3
  '@types/node': ^24
  '@types/react': ^19.2
  '@types/react-dom': ^19.2

  # auth
  better-auth: ^1.6
  drizzle-kit: ^0.31
  pg: ^8.23
  '@types/pg': ^8.21

  # data
  drizzle-orm: ^0.45
  hono: ^4.12
